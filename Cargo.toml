[package]
edition = "2021"
name = "xpodcasts"
version = "0.1.0"

[workspace]
members = ["podcasts-data"]
resolver = "3"

[workspace.package]
edition = "2024"

# Centralized versions managed here once
[workspace.dependencies]
anyhow = "1.0.103"
async-channel = "2.5.0"
chrono = {version = "0.4.45", features = ["serde", "unstable-locales"]}
log = "0.4.33"
podcasts-data = {path = "podcasts-data"}
reqwest = {version = "0.13.4", features = ["form", "json"]}
tokio = {version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"]}
url = "2.5.8"

[dependencies]
anyhow = {workspace = true}
async-channel = {workspace = true}
chrono = {workspace = true}
log = {workspace = true}
podcasts-data = {workspace = true}
reqwest = {workspace = true}
tokio = {workspace = true}
url = {workspace = true}

adw = {version = "0.8.1", package = "libadwaita", features = ["v1_9"]}
gst = {version = "0.23", package = "gstreamer"}
gst-pbutils = {version = "0.23", package = "gstreamer-pbutils"}
gst-play = {version = "0.23", package = "gstreamer-play"}
gtk = {version = "0.10.3", package = "gtk4", features = ["v4_12"]}
regex = "1.12.4"
relm4 = {version = "0.10.1", features = ["macros", "libadwaita"]}
ucs2 = "0.3.3"

ammonia = "4.1.3"
formatx = "0.4.0"
gettext-rs = {version = "0.7.7", features = ["gettext-system"]}
html2pango = "0.6.0"
html2text = "0.17.1"
html5ever = "0.39.0"
image = {version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"]}
linkify = "0.11.0"
locale_config = "0.3.0"
markup5ever_rcdom = "0.39.0"
mpris-player = "0.6.3"
pretty_env_logger = "0.5.0"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
uuid = {version = "1.24.0", features = ["v4"]}
env_logger = "0.11.11"

# --- OPTIMIZATION PROFILES ---

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1 # Reduces parallel code generation to let the compiler optimize harder
lto = "thin" # Link-Time Optimization drastically speeds up global cross-crate async calls
opt-level = 3 # Maximum optimizations for runtime execution speed
panic = "abort" # Removes unwind overhead (shrinks binary size considerably)
strip = true # Automatically strips all debug symbols and tables from the final executable
